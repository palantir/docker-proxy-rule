buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.79.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name='docker-proxy-rule'

include ':docker-proxy-rule-core'
include ':docker-proxy-rule-core-jdk21'
include ':docker-proxy-rule-junit4'
include ':docker-proxy-junit-jupiter'

throw new RuntimeException('''The excavator failed to run properly:\n\n''' + file('gradle/exception').text)
