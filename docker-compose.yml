version: '3.8'

services:
  # Main Docker Proxy Rule application
  docker-proxy-rule:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for development
    image: palantir/docker-proxy-rule:latest
    container_name: docker-proxy-rule
    ports:
      - "1080:1080"  # SOCKS proxy port
      - "8080:8080"  # Management/health check port (if needed)
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - PROXY_PORT=1080
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs  # Log volume
    networks:
      - docker-proxy-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Test web server (nginx)
  test-web-server:
    image: nginx:alpine
    container_name: test-web-server
    ports:
      - "8081:80"
    volumes:
      - ./test-data/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./test-data/html:/usr/share/nginx/html:ro
    networks:
      - docker-proxy-network
    depends_on:
      - docker-proxy-rule

  # Test database (PostgreSQL)
  test-database:
    image: postgres:15-alpine
    container_name: test-database
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./test-data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - docker-proxy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching tests)
  test-redis:
    image: redis:7-alpine
    container_name: test-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - docker-proxy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Monitoring - Prometheus (metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - docker-proxy-network
    depends_on:
      - docker-proxy-rule

  # Monitoring - Grafana (dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - docker-proxy-network
    depends_on:
      - prometheus

networks:
  docker-proxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
